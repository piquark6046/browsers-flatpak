name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate TypeScript and tests
        run: npm run check
      - name: Check whitespace
        run: git diff --check

  resolve:
    name: Resolve tracked and live inputs
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve signed build inputs
        id: resolve
        run: |
          npm run ci:upstream -- \
            --command resolve \
            --mode pr \
            --output-directory "${RUNNER_TEMP}/resolution" \
            --source-revision "${GITHUB_SHA}"
      - name: Upload verified resolution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: pull-request-resolution
          path: ${{ runner.temp }}/resolution
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  build:
    name: Build ${{ matrix.Variant }} ${{ matrix.Definition }} ${{ matrix.Architecture }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.Runner }}
    container:
      image: ${{ matrix.Image }}
      options: --privileged
    steps:
      - name: Download verified resolution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: pull-request-resolution
          path: ${{ runner.temp }}/resolution
      - name: Configure runtime source
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build and lint native repository
        env:
          ARCHITECTURE: ${{ matrix.Architecture }}
          DEFINITION_DIRECTORY: ${{ runner.temp }}/resolution/${{ matrix.DefinitionPath }}
          LINTER: ${{ runner.temp }}/resolution/${{ matrix.LinterPath }}
          MANIFEST: ${{ runner.temp }}/resolution/${{ matrix.ManifestPath }}
        run: |
          test -d "${DEFINITION_DIRECTORY}"
          test -f "${LINTER}"
          test -f "${MANIFEST}"
          flatpak-builder \
            --arch="${ARCHITECTURE}" \
            --collection-id=dev.piquark6046.Browsers \
            --default-branch=stable \
            --disable-rofiles-fuse \
            --force-clean \
            --install-deps-from=flathub \
            --repo="${RUNNER_TEMP}/repo" \
            "${RUNNER_TEMP}/build" \
            "${MANIFEST}"
          flatpak-builder-lint \
            --exceptions \
            --user-exceptions "${LINTER}" \
            manifest "${MANIFEST}"
          ostree --repo="${RUNNER_TEMP}/repo" fsck

  flatpak-build-gate:
    name: Flatpak build gate
    if: always()
    needs:
      - quality
      - resolve
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Require every pull request check
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: |
          test "${QUALITY_RESULT}" = success
          test "${RESOLVE_RESULT}" = success
          test "${BUILD_RESULT}" = success
