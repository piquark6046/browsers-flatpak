name: Publish resolved Flatpak repository

on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upstream.yml'
      - 'browsers/**'
      - 'devops/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
  workflow_dispatch:
    inputs:
      version:
        description: Exact Firefox Developer Edition beta to publish
        required: false
        type: string
      nightly_build_id:
        description: Exact 14-digit Firefox Nightly build ID to publish
        required: false
        type: string
      force:
        description: Rebuild even when the signed output fingerprint is unchanged
        default: false
        required: false
        type: boolean
      allow_downgrade:
        description: Allow an exact-version rollback
        default: false
        required: false
        type: boolean
      bootstrap:
        description: Permit the first publication when no signed state exists
        default: false
        required: false
        type: boolean

concurrency:
  group: pages-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and verify upstream
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      should-publish: ${{ steps.resolve.outputs.should-publish }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # 6.0.9
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run fast checks
        run: npm run check
      - name: Resolve signed upstream inputs
        id: resolve
        env:
          ALLOW_DOWNGRADE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_downgrade || false }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap || false }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          NIGHTLY_BUILD_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.nightly_build_id || '' }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/resolution
          SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          arguments=(
            --command resolve
            --mode production
            --output-directory "${OUTPUT_DIRECTORY}"
            --source-revision "${SOURCE_REVISION}"
            --force "${FORCE}"
            --allow-downgrade "${ALLOW_DOWNGRADE}"
            --bootstrap "${BOOTSTRAP}"
          )
          if [ -n "${VERSION}" ]; then
            arguments+=(--version "${VERSION}")
          fi
          if [ -n "${NIGHTLY_BUILD_ID}" ]; then
            arguments+=(--nightly-build-id "${NIGHTLY_BUILD_ID}")
          fi
          npm run ci:upstream -- "${arguments[@]}"
      - name: Upload verified resolution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: verified-production-resolution
          path: ${{ runner.temp }}/resolution
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  build:
    name: Build ${{ matrix.Variant }} ${{ matrix.Definition }} ${{ matrix.Architecture }}
    needs: resolve
    if: needs.resolve.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.Runner }}
    container:
      image: ${{ matrix.Image }}
      options: --privileged
    steps:
      - name: Download verified resolution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: verified-production-resolution
          path: ${{ runner.temp }}/resolution
      - name: Configure runtime source
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build unsigned native repository
        env:
          ARCHITECTURE: ${{ matrix.Architecture }}
          LINTER: ${{ runner.temp }}/resolution/${{ matrix.LinterPath }}
          MANIFEST: ${{ runner.temp }}/resolution/${{ matrix.ManifestPath }}
        run: |
          test -f "${LINTER}"
          test -f "${MANIFEST}"
          mkdir -p "${RUNNER_TEMP}/export"
          flatpak-builder \
            --arch="${ARCHITECTURE}" \
            --collection-id=dev.piquark6046.Browsers \
            --default-branch=stable \
            --disable-rofiles-fuse \
            --force-clean \
            --install-deps-from=flathub \
            --repo="${RUNNER_TEMP}/export/repo" \
            "${RUNNER_TEMP}/build" \
            "${MANIFEST}"
          flatpak-builder-lint \
            --exceptions \
            --user-exceptions "${LINTER}" \
            manifest "${MANIFEST}"
          ostree --repo="${RUNNER_TEMP}/export/repo" fsck
          tar \
            --create \
            --file="${RUNNER_TEMP}/export/repo.tar" \
            --directory="${RUNNER_TEMP}/export" \
            repo
      - name: Upload unsigned native repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.ArtifactName }}
          path: ${{ runner.temp }}/export/repo.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  publish:
    name: Sign and stage GitHub Pages
    needs:
      - resolve
      - build
    if: needs.resolve.outputs.should-publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    environment: flatpak-signing
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:f584c1b5d516b413993557f9f88d2532e32888386e043ce4c8c4afeaf771c6b9
      options: --privileged
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # 6.0.9
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download verified resolution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: verified-production-resolution
          path: ${{ runner.temp }}/resolution
      - name: Download native repositories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: production-*
          path: ${{ runner.temp }}/build-artifacts
      - name: Restore native repositories
        run: |
          restored=0
          for artifact_directory in \
            "${RUNNER_TEMP}"/build-artifacts/production-*; do
            test -d "${artifact_directory}"
            archive="${artifact_directory}/repo.tar"
            test -f "${archive}"
            tar \
              --extract \
              --file="${archive}" \
              --directory="${artifact_directory}" \
              --no-same-owner
            ostree --repo="${artifact_directory}/repo" fsck
            restored=$((restored + 1))
          done
          test "${restored}" -gt 0
      - name: Assemble and sign publication
        env:
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          FLATPAK_GPG_SECRET_SUBKEY_B64: ${{ secrets.FLATPAK_GPG_SECRET_SUBKEY_B64 }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npm run ci:upstream -- \
            --command finalize \
            --bundle "${RUNNER_TEMP}/resolution/resolution-bundle.json" \
            --build-artifacts-directory "${RUNNER_TEMP}/build-artifacts" \
            --site-directory "${RUNNER_TEMP}/site" \
            --workflow-run-url "${WORKFLOW_RUN_URL}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # 6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # 5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy GitHub Pages
    needs: publish
    permissions:
      contents: read
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # 5.0.0
