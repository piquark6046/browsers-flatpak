id: dev.piquark6046.Firefox.Nightly
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.mozilla.firefox.BaseApp
base-version: '26.08'
command: firefox-nightly
separate-locales: true

build-options:
  no-debuginfo: true
  strip: false

add-extensions:
  dev.piquark6046.Firefox.Nightly.systemconfig:
    directory: etc/firefox
    no-autodownload: true

finish-args:
  - --require-version=0.11.1
  - --allow=devel
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=pcsc
  - --socket=cups
  - --persist=.mozilla
  - --env=DICPATH=/usr/share/hunspell
  - --env=MOZ_APP_REMOTINGNAME=dev.piquark6046.Firefox.Nightly
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-download:rw
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.a11y.Bus
  - --talk-name=org.gtk.vfs.*
  - --system-talk-name=org.freedesktop.NetworkManager
  - --own-name=org.mpris.MediaPlayer2.firefox.*

cleanup-commands:
  - mkdir -p "${FLATPAK_DEST}/etc/firefox"

modules:
  # The Freedesktop runtime has no CJK fonts, so Korean, Japanese, and Chinese
  # text renders as missing glyphs unless the host exposes a covering font.
  - name: noto-sans-cjk
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "${FLATPAK_DEST}/share/fonts/noto-cjk" NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc
    sources:
      - type: archive
        url: https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/03_NotoSansCJK-OTC.zip
        sha256: 528f4e1b25ff3badb0321b38d015d954c4c0de926c7830ef50e4a1948f6a3eed
        strip-components: 0

  # The runtime has no font for Telugu, Myanmar, Khmer, Tibetan, or Mongolian
  # and covers the other Indic scripts only with GNU FreeFont.
  - name: noto-fonts
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "${FLATPAK_DEST}/share/fonts/noto" *.ttf
      - install -Dm644 noto-fonts.conf "${FLATPAK_DEST}/etc/fonts/local.conf"
